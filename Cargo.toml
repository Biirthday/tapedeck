[package]
name = "tapedeck"
version = "0.1.0"
edition = "2024"

[dependencies]
dirs = "7.0.0"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
macroquad = "0.4.16"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
