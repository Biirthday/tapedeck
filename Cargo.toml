[package]
name = "tapedeck"
version = "0.1.0"
edition = "2024"
description = "Cassette-wall music player for a local library, with bit-perfect playback"
readme = "README.md"
license = "MIT"
repository = "https://github.com/Biirthday/tapedeck"
authors = ["LLC171 <privacy@llc171.anonaddy.me>"]

[dependencies]
dirs = "7.0.0"
# Text is drawn with fontdue directly; parsing in parallel matters for the
# CJK font, which has ~45k glyphs.
fontdue = { version = "0.9.5", features = ["parallel"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png"] }
lofty = "0.25.5"
macroquad = "0.4.16"
rodio = { version = "0.23.0", default-features = false, features = ["playback", "symphonia-all"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
souvlaki = { version = "0.9.3", default-features = false, features = ["use_zbus"] }
zbus = "5.19.0"
zvariant = "5.15.1"
